        (function() {
            const NativeWorker = window.Worker;
            window.Worker = function(scriptURL, options) {
                const urlStr = (scriptURL instanceof URL) ? scriptURL.href : String(scriptURL);
                if (urlStr.startsWith('http://') || urlStr.startsWith('https://')) {
                    if (!urlStr.startsWith(window.location.origin)) {
                        const blob = new Blob([`importScripts(${JSON.stringify(urlStr)});`], { type: 'text/javascript' });
                        return new NativeWorker(URL.createObjectURL(blob), options);
                    }
                }
                return new NativeWorker(scriptURL, options);
            };
            window.Worker.prototype = NativeWorker.prototype;
        })();
    </script>

        const blobToBase64 = (blob) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result.split(',')[1]);

            reader.readAsDataURL(blob);
        });

        const parseSrtBlocks = (srt) => {
            if (!srt) return [];
            const blocks = srt.replace(/\r\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim().split(/\n\n+/);
            return blocks.map(block => {
                const lines = block.split('\n');
                const timeIdx = lines.findIndex(l => l.includes('-->'));
                if (timeIdx === -1) return null;
                const m = lines[timeIdx].match(/(\d+):(\d{2}):(\d{2})[,.](\d+)\s*-->\s*(\d+):(\d{2}):(\d{2})[,.](\d+)/);
                if (!m) return null;
                const start = +m[1]*3600 + +m[2]*60 + +m[3] + +m[4]/(m[4].length === 2 ? 100 : 1000);
                const end = +m[5]*3600 + +m[6]*60 + +m[7] + +m[8]/(m[8].length === 2 ? 100 : 1000);
                const text = lines.slice(timeIdx + 1).join(' ').replace(/<[^>]+>/g, '').trim();
                return { start, end, text };
            }).filter(b => b && b.text);
        };

        const parseGeminiCandidateText = (d) => {
            if (d?.error) throw new Error(d.error.message || (typeof d.error === 'string' ? d.error : JSON.stringify(d.error)));

            if (!text) {

                throw new Error(blockReason ? `Gemini Blocked: ${blockReason}` : "Gemini API မအောင်မြင်ပါ");
            }
            return text.replace(/^```(json)?\n?/i, '').replace(/\n```$/i, '').trim();
        };

        const writeString = (view, offset, str) => { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); };
        const exportWAV = (channelData, sampleRate) => {
            const buffer = new ArrayBuffer(44 + channelData.length * 2);
            const view = new DataView(buffer);
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + channelData.length * 2, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(view, 36, 'data');
            view.setUint32(40, channelData.length * 2, true);
            let offset = 44;
            for (let i = 0; i < channelData.length; i++, offset += 2) {
                const s = Math.max(-1, Math.min(1, channelData[i]));
                view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }
            return new Blob([view], { type: 'audio/wav' });
        };

        function wrapMyanmarText(ctx, text, maxWidth) {
            const words = text.includes(' ') ? text.split(' ') : text.match(/.{1,10}/g) || [text];
            const lines = [];
            let currentLine = '';

            for (let i = 0; i < words.length; i++) {
                const word = words[i];
                const testLine = currentLine ? currentLine + (text.includes(' ') ? ' ' : '') + word : word;
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && i > 0) {
                    lines.push(currentLine);
                    currentLine = word;
                } else {
                    currentLine = testLine;
                }
            }
            if (currentLine) lines.push(currentLine);
            return lines;
        }

        async function fetchWithProgress(url, onProgress) {
            const response = await fetch(url);
            const contentLength = response.headers.get('content-length');
            const total = contentLength ? parseInt(contentLength, 10) : 0;
            let loaded = 0;
            const reader = response.body.getReader();
            const chunks = [];
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                loaded += value.length;
                if (total > 0 && onProgress) {
                    onProgress(Math.min(1.0, loaded / total));
                }
            }
            const allChunks = new Uint8Array(loaded);
            let position = 0;
            for (const chunk of chunks) {
                allChunks.set(chunk, position);
                position += chunk.length;
            }
            return new Blob([allChunks]);
        }

            // Video အရှည်နှင့် ရွေးထားသော Key Mode အလိုက် Real-time ကုန်ကျငွေ တွက်ချက်ပေးသည့် Function
            const getCalculatedTotalCredit = () => {
                if (!videoDurationSec || videoDurationSec <= 0) return 0;
                const fullMins = Math.floor(videoDurationSec / 60);
                const remSec = videoDurationSec % 60;
                const durMins = Math.max(1, remSec > 30 ? fullMins + 1 : fullMins);
                const isOwn = (videoKeyMode === 'own');

                const baseRate = parseInt(isOwn 
                    ? (globalSettings.own_key_rate_per_min || 20) 
                    : (globalSettings.server_key_rate_per_min || globalSettings.deduction_rate_per_min || 50));
                
                const discEnabled = isOwn 
                    ? (globalSettings.own_key_discount_enabled !== 'false')
                    : (globalSettings.server_key_discount_enabled !== 'false');

                const firstTwoRate = parseInt(isOwn 
                    ? (globalSettings.own_key_first_two_rate || 15) 
                    : (globalSettings.server_key_first_two_rate || globalSettings.first_two_min_rate || 30));

                const dailyQuota = parseInt(globalSettings.free_minutes_per_day || '0');
                
                // User ၏ ယနေ့ Free မိနစ် လက်ကျန် တွက်ချက်ခြင်း
                const remainingFree = (userData && userData.free_mins_remaining !== undefined)
                    ? userData.free_mins_remaining
                    : Math.max(0, dailyQuota - (userData?.free_mins_used || 0));

                const freeToUse = Math.min(durMins, remainingFree);
                const chargeableMins = durMins - freeToUse;

                // ၁။ Free မိနစ် အပြည့်အဝရပါက အခမဲ့
                if (freeToUse > 0 && chargeableMins === 0) {
                    return 0;
                }

                // ၂။ Free မိနစ် အချို့ရပြီး ပိုလာသော မိနစ်များအား လျှော့ဈေးမပါဘဲ ပုံမှန် Base Rate ဖြင့်သာ ဖြတ်မည်
                if (freeToUse > 0 && chargeableMins > 0) {
                    return chargeableMins * baseRate;
                }

                // ၃။ Free မရတော့ပါက ပထမ ၂ မိနစ် လျှော့ဈေးဖြင့် တွက်မည်
                if (discEnabled && firstTwoRate > 0) {
                    if (chargeableMins <= 2) return firstTwoRate;
                    return firstTwoRate + ((chargeableMins - 2) * baseRate);
                }
                return chargeableMins * baseRate;
            };

                    }

                    // ၂။ အရန်အဆင့်: User Gemini API Key သို့ Fallback လုပ်ခြင်း
                    return await executeWithApiLogic("Find Hook", async (apiKey) => {
                        const payload = {
                            contents: [{ parts: [{ text: `${prompt}\n\nTranscript:\n${fullText}` }] }],
                            generationConfig: { temperature: 0.3, responseMimeType: "application/json" }
                        };
                        const url = apiKey 
                            ? `/api/gemini/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}` 
                            : `/api/gemini/v1beta/models/gemini-2.5-flash:generateContent`;
                        const res = await apiFetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                        const data = await res.json();
                        return JSON.parse(parseGeminiCandidateText(data));
                    });
                } catch (e) {
                    addSysLog(`Hook ရှာမရသဖြင့် ပုံမှန်အတိုင်း ဆက်လုပ်ပါမည်: ${e.message}`);
                    return null;
                }
            };
            // ၃ မိနစ် (180s) စာ Blocks များအား စုစည်းပြီး တစ်သုတ်စီ ဘာသာပြန်ခြင်း
            // ရွေးချယ်ထားသော Language အတိုင်း မဖြစ်မနေ ဘာသာပြန်မည့် Engine
            const performTranslation = async (originalSrt, modeOverride = null, forceOwnKey = false) => {
                const activeMode = modeOverride || recapMode;
                setProgressStage(activeMode === 'own' ? "ဇာတ်လမ်းပြော စတိုင် Script ရေးသားနေပါသည်" : "ဘာသာပြန် script ထုတ်နေပါသည်");
                addSysLog(`AI ဖြင့် [Target Language: ${selectedLang}] သို့ ${activeMode === 'own' ? 'Storytelling Recap' : 'Direct Translation'} စနစ်သုံး၍ ပြန်ဆိုနေပါသည်...`);
                
                const originalBlocks = parseSrtBlocks(originalSrt).map((b, i) => ({ id: i + 1, start: b.start, end: b.end, text: b.text }));
                let allTranslated = [];

                const batches = [];
                let currentBatch = [];
                let batchStart = originalBlocks[0]?.start || 0;

                for (const b of originalBlocks) {
                    if (currentBatch.length > 0 && (b.end - batchStart > 90)) {
                        batches.push(currentBatch);
                        currentBatch = [b];
                        batchStart = b.start;
                    } else {
                        if (currentBatch.length === 0) batchStart = b.start;
                        currentBatch.push(b);
                    }
                }
                if (currentBatch.length > 0) batches.push(currentBatch);

                // STRICT TARGET LANGUAGE ENFORCEMENT PROMPT
                const ownRecapPrompt = `You are a professional movie recap narrator and cinematic storyteller.
Analyze the provided scene segments and generate a compelling, cinematic recap script strictly synchronized with the timestamps.

[RULES & STORYTELLING GUIDELINES]
1. Do NOT translate dialog word-by-word. Rewrite contextually as an engaging third-person movie recap narrator with high emotional and dramatic impact.
2. Pace and Duration: Keep the narration length concise enough to fit naturally within each segment's duration (approx. 2.5 to 3 Burmese words per second).
3. Tone of Voice: Cinematic, captivating, suspenseful, and natural spoken Myanmar storytelling style (Standard Unicode).
4. Timestamp Precision: Keep 'id', 'start', and 'end' exactly identical to input segments.
5. Output format: Return ONLY a valid JSON array of objects with keys: "id", "start", "end", "text".`;

                const originalPrompt = `You are an expert translator. 
CRITICAL REQUIREMENT: Translate all dialogue/text strictly into fluent, natural spoken ${selectedLang}.
DO NOT output in English unless the selected target language is explicitly English.
Keep 'id', 'start', and 'end' identical. Return ONLY a valid JSON array of objects with keys: id, start, end, text.`;

                for (let i = 0; i < batches.length; i++) {
                    const batch = batches[i];
                    let translatedBatch = null;
                    const sysPrompt = activeMode === 'own' ? ownRecapPrompt : originalPrompt;

                    if (!forceOwnKey) {
                        try {
                            const sRes = await apiFetch('/api/engine/neural-compute', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    model: "neural-compute-stream",
                                    messages: [
                                        { role: "system", content: sysPrompt },
                                        { role: "user", content: `Translate this JSON array strictly into ${selectedLang}:\n` + JSON.stringify(batch) }
                                    ],
                                    temperature: activeMode === 'own' ? 0.6 : 0.2
                                })
                            });
                            if (sRes.ok) {
                                const sData = await sRes.json();
                                const cText = sData?.choices?.[0]?.message?.content || "";
                                translatedBatch = JSON.parse(cText.replace(/^```(json)?\n?/i, '').replace(/\n```$/i, '').trim());
                            } else {
                                throw new Error("Server AI Error");
                            }
                        } catch (sErr) {
                            if (!forceOwnKey) throw sErr;
                        }
                    }

                    // ၂။ User Gemini Key သို့ Fallback ပြုလုပ်ခြင်း
                    if (!translatedBatch) {
                        translatedBatch = await executeWithApiLogic("Translation", async (apiKey) => {
                            const payload = {
                                contents: [{ parts: [{ text: `Strictly translate this JSON array into ${selectedLang}:\n${JSON.stringify(batch)}` }] }],
                                systemInstruction: { parts: [{ text: sysPrompt }] },
                                generationConfig: { temperature: activeMode === 'own' ? 0.6 : 0.2, responseMimeType: "application/json" }
                            };
                            const url = apiKey 
                                ? `/api/gemini/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}` 
                                : `/api/gemini/v1beta/models/gemini-2.5-flash:generateContent`;
                            const res = await apiFetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                            const data = await res.json();
                            return JSON.parse(parseGeminiCandidateText(data));
                        });
                    }

                    // Item Mapping စစ်ဆေးခြင်း
                    for (let j = 0; j < batch.length; j++) {
                        let item = null;
                        if (Array.isArray(translatedBatch)) {
                            item = translatedBatch.find(x => x.id === batch[j].id) || translatedBatch[j];
                        }
                        allTranslated.push({
                            id: batch[j].id,
                            start: batch[j].start,
                            end: batch[j].end,
                            text: (item && item.text && item.text.trim()) ? item.text.trim() : batch[j].text
                        });
                    }
                    setRenderProgress(Math.min(45, Math.floor(25 + (20 * ((i + 1) / batches.length)))));
                }
                return allTranslated;
            };

            // Edge TTS (2 Parallel Chunks) နှင့် Gemini TTS (1-Min Window Slicing) + Silent Gaps ထိန်းသိမ်းခြင်း
            const performTTSGeneration = async (translatedBlocks) => {
                setProgressStage("Voiceover ထုတ်နေပါသည်");
                addSysLog(`${recapEngine === 'edge' ? 'Edge TTS (2 Chunks Parallel)' : 'Gemini TTS (1-Min Window Slicing)'} ဖြင့် အသံထုတ်ယူနေပါသည်...`);
                
                const tempAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let processedChunks = [];

                if (recapEngine === 'voice_clone') {
                    if (!cloneAudioFile) throw new Error("Voice Clone ပြုလုပ်ရန် စံနမူနာ အသံဖိုင် (Reference Audio) တင်ပေးပါ သို့မဟုတ် Mic ဖြင့် အသံသွင်းပေးပါခင်ဗျာ");
                    
                    for (let i = 0; i < translatedBlocks.length; i++) {
                        const block = translatedBlocks[i];
                        const fd = new FormData();
                        fd.append("text", block.text);
                        fd.append("reference_audio", cloneAudioFile);

                        const res = await apiFetch('/api/voice-clone/tts', { method: 'POST', body: fd });
                        if (!res.ok) {
                            const err = await res.json();
                            throw new Error(err.detail || "Colab Voice Clone အသံထုတ်မရပါ");
                        }
                        const audioBlob = await res.blob();
                        const audioBuffer = await tempAudioCtx.decodeAudioData(await audioBlob.arrayBuffer());

                        processedChunks.push({
                            vStart: block.start,
                            vEnd: block.end,
                            text: block.text,
                            audioBuffer: audioBuffer,
                            audioDur: audioBuffer.duration
                        });
                        setRenderProgress(Math.min(60, Math.floor(45 + ((i + 1) / translatedBlocks.length) * 15)));
                    }
                } else if (recapEngine === 'edge') {
                    // Edge TTS: တစ်ကြိမ်လျှင် ၂ ခုစီ Parallel ပြိုင်တူထုတ်ယူခြင်း
                    for (let i = 0; i < translatedBlocks.length; i += 2) {
                        const pair = translatedBlocks.slice(i, i + 2);
                        const results = await Promise.all(pair.map(async (block) => {
                            const text = block.text?.trim() || " ";
                            let audioBuffer = null;
                            let actualDur = Math.max(0.5, block.end - block.start);

                            try {
                                const response = await apiFetch('/api/tts', { 
                                    method: 'POST', 
                                    headers: { 'Content-Type': 'application/json' }, 
                                    body: JSON.stringify({
                                        text: text,
                                        voice: recapVoice,
                                        rate: `${Math.round((voiceSpeed * 1.15 - 1.0) * 100) >= 0 ? '+' : ''}${Math.round((voiceSpeed * 1.15 - 1.0) * 100)}%`
                                    })
                                });
                                if (!response.ok) throw new Error("TTS generation failed");
                                const mp3Blob = await response.blob();
                                audioBuffer = await tempAudioCtx.decodeAudioData(await mp3Blob.arrayBuffer());
                                actualDur = audioBuffer.duration;
                            } catch (e) {
                                const offlineCtx = new OfflineAudioContext(1, 24000, 24000);
                                audioBuffer = offlineCtx.createBuffer(1, 24000, 24000);
                                actualDur = Math.max(0.5, block.end - block.start);
                            }

                            return {
                                vStart: block.start,
                                vEnd: block.end,
                                text: block.text,
                                audioBuffer,
                                audioDur: actualDur
                            };
                        }));

                        processedChunks.push(...results);
                        setRenderProgress(Math.min(60, Math.floor(45 + ((i + pair.length) / translatedBlocks.length) * 15)));
                    }
                } else {
                    // Gemini TTS: ၀ မှ ၁ မိနစ် (၆၀ စက္ကန့်) Window Slicing ပုံစံ
                    const timeGroups = [];
                    let curGroup = [];
                    let groupStartTime = translatedBlocks[0]?.start || 0;

                    for (const b of translatedBlocks) {
                        if (curGroup.length > 0 && (b.end - groupStartTime > 60)) {
                            timeGroups.push(curGroup);
                            curGroup = [b];
                            groupStartTime = b.start;
                        } else {
                            if (curGroup.length === 0) groupStartTime = b.start;
                            curGroup.push(b);
                        }
                    }
                    if (curGroup.length > 0) timeGroups.push(curGroup);

                    for (let g = 0; g < timeGroups.length; g++) {
                        const group = timeGroups[g];
                        const combinedText = group.map(b => b.text).join(" ... ");

                        let groupBuffer = null;
                        try {
                            await executeWithApiLogic("Gemini 1-Min TTS", async (apiKey) => {
                                const payload = {
                                    contents: [{ parts: [{ text: combinedText }] }],
                                    generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: recapVoice } } } }
                                };
                                const url = apiKey ? `/api/gemini/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}` : `/api/gemini/v1beta/models/gemini-2.5-flash-preview-tts:generateContent`;
                                const res = await apiFetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                                const data = await res.json();
                                const pcmBase64 = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                                if (!pcmBase64) throw new Error("Audio missing");

                                const bin = atob(pcmBase64);
                                const bytes = new Uint8Array(bin.length);
                                for (let j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
                                const count = Math.floor(bytes.length / 2);
                                
                                const offlineCtx = new OfflineAudioContext(1, count, 24000);
                                groupBuffer = offlineCtx.createBuffer(1, count, 24000);
                                const out = groupBuffer.getChannelData(0);
                                for (let k = 0; k < count; k++) {
                                    const idx = k * 2;
                                    const int16 = (bytes[idx + 1] << 8) | bytes[idx];
                                    out[k] = (int16 >= 0x8000 ? int16 - 0x10000 : int16) / 32768.0;
                                }
                            });
                        } catch (e) {
                            const offlineCtx = new OfflineAudioContext(1, 24000, 24000);
                            groupBuffer = offlineCtx.createBuffer(1, 24000, 24000);
                        }

                        const totalChars = group.reduce((acc, b) => acc + (b.text?.length || 1), 0);
                        let currentOffsetTime = 0;

                        for (const b of group) {
                            const ratio = (b.text?.length || 1) / totalChars;
                            const segDur = Math.max(0.5, groupBuffer.duration * ratio);
                            const sampleRate = groupBuffer.sampleRate;
                            const startSample = Math.floor(currentOffsetTime * sampleRate);
                            const endSample = Math.min(groupBuffer.length, Math.floor((currentOffsetTime + segDur) * sampleRate));
                            const segSamples = Math.max(1, endSample - startSample);

                            const segBuffer = tempAudioCtx.createBuffer(1, segSamples, sampleRate);
                            const segData = segBuffer.getChannelData(0);
                            const groupData = groupBuffer.getChannelData(0);
                            for (let s = 0; s < segSamples; s++) {
                                segData[s] = groupData[startSample + s] || 0;
                            }

                            processedChunks.push({
                                vStart: b.start,
                                vEnd: b.end,
                                text: b.text,
                                audioBuffer: segBuffer,
                                audioDur: segDur
                            });
                            currentOffsetTime += segDur;
                        }
                        setRenderProgress(Math.min(60, Math.floor(45 + ((g + 1) / timeGroups.length) * 15)));
                    }
                }

                // အသံမပါသော အပိုင်းများ (Silent Gaps) မပျောက်စေရန် Timeline ပြန်လည်တည်ဆောက်ခြင်း
                processedChunks.sort((a, b) => a.vStart - b.vStart);

                let currentRealTime = 0;
                let currentVTime = 0;
                const syncTimeline = [];

                for (let i = 0; i < processedChunks.length; i++) {
                    const chunk = processedChunks[i];

                    // စကားမပြောသော ကြားအပိုင်း (Gap) ရှိပါက မူရင်း Speed (1.0x) အတိုင်း ဆက်လက် run စေခြင်း
                    if (chunk.vStart > currentVTime + 0.05) {
                        const gapDuration = chunk.vStart - currentVTime;
                        syncTimeline.push({
                            type: 'gap',
                            startReal: currentRealTime,
                            endReal: currentRealTime + gapDuration,
                            vStart: currentVTime,
                            vEnd: chunk.vStart,
                            vSpeed: 1.0,
                            text: "",
                            audioBuffer: null,
                            durationReal: gapDuration
                        });
                        currentRealTime += gapDuration;
                        currentVTime = chunk.vStart;
                    }

                    // Voice Speed အလိုက် Video Playback Speed ကို သဟဇာတဖြစ်အောင် ချိန်ညှိခြင်း
                    const vDuration = Math.max(0.1, chunk.vEnd - chunk.vStart);
                    const speedRatio = vDuration / Math.max(0.1, chunk.audioDur);
                    const calculatedSpeed = Math.max(0.35, Math.min(2.5, speedRatio));

                    syncTimeline.push({
                        type: 'narrate',
                        startReal: currentRealTime,
                        endReal: currentRealTime + chunk.audioDur,
                        vStart: chunk.vStart,
                        vEnd: chunk.vEnd,
                        vSpeed: calculatedSpeed,
                        text: chunk.text,
                        audioBuffer: chunk.audioBuffer,
                        durationReal: chunk.audioDur
                    });
                    currentRealTime += chunk.audioDur;
                    currentVTime = chunk.vEnd;
                }

                const totalAudioDur = currentRealTime > 0 ? currentRealTime : 10;
                tempAudioCtx.close();
                return { syncTimeline, totalAudioDur };
            };

            const renderToWebM = async (syncData, videoSrcUrl, meta) => {
                return new Promise(async (resolve, reject) => {
                    let animFrameId = null;
                    let isFinished = false;

                    try {
                        const { syncTimeline, totalAudioDur } = syncData;
                        setProgressStage("Creating Video");
                        setRenderProgress(65);

                        const sampleRate = 44100;
                        const finalAudioLength = currentView === 'recap' ? Math.max(totalAudioDur, meta.duration || 10) : meta.duration;

                        const video = document.createElement('video');
                        video.src = videoSrcUrl;
                        video.crossOrigin = "anonymous";
                        video.muted = (currentView === 'recap');
                        video.playsInline = true;

                        await new Promise((res, rej) => {
                            video.onloadeddata = res;
                            video.onerror = rej;
                        });

                        const playAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        if (playAudioCtx.state === 'suspended') await playAudioCtx.resume();
                        const dest = playAudioCtx.createMediaStreamDestination();

                        if (currentView === 'subtitle') {
                            const vidSourceNode = playAudioCtx.createMediaElementSource(video);
                            vidSourceNode.connect(dest);
                        } else {
                            const offlineCtx = new OfflineAudioContext(2, Math.ceil(finalAudioLength * sampleRate), sampleRate);
                            syncTimeline.forEach(event => {
                                if (event.type === 'narrate' && event.audioBuffer) {
                                    const src = offlineCtx.createBufferSource();
                                    src.buffer = event.audioBuffer;
                                    src.playbackRate.value = 1.0;
                                    src.connect(offlineCtx.destination);
                                    src.start(event.startReal);
                                }
                            });

                            if (bgMusicFile) {
                                const tempAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                                const bgArrBuf = await bgMusicFile.arrayBuffer();
                                const bgDecoded = await tempAudioCtx.decodeAudioData(bgArrBuf);
                                const bgSrc = offlineCtx.createBufferSource();
                                bgSrc.buffer = bgDecoded;
                                bgSrc.loop = true;
                                const bgGain = offlineCtx.createGain();
                                bgGain.gain.value = bgMusicVolume / 100;
                                bgSrc.connect(bgGain);
                                bgGain.connect(offlineCtx.destination);
                                bgSrc.start(0);
                                tempAudioCtx.close();
                            }

                            const masterAudioBuffer = await offlineCtx.startRendering();
                            const singleMasterSource = playAudioCtx.createBufferSource();
                            singleMasterSource.buffer = masterAudioBuffer;
                            singleMasterSource.connect(dest);
                            singleMasterSource.start(0);
                        }

                        const canvas = document.createElement('canvas');
                        const originalW = meta.width || 1280;
                        const originalH = meta.height || 720;
                        const scaleFactor = Math.min(1280 / originalW, 720 / originalH);
                        const vidW = Math.floor((originalW * scaleFactor) / 2) * 2;
                        const vidH = Math.floor((originalH * scaleFactor) / 2) * 2;

                        canvas.width = vidW;
                        canvas.height = vidH;
                        const ctx = canvas.getContext('2d');

                        const freezeCanvas = document.createElement('canvas');
                        freezeCanvas.width = vidW;
                        freezeCanvas.height = vidH;
                        const freezeCtx = freezeCanvas.getContext('2d');

                        const canvasStream = canvas.captureStream(18);
                        const combinedStream = new MediaStream([
                            ...canvasStream.getVideoTracks(),
                            ...dest.stream.getAudioTracks()
                        ]);

                        const supportedTypes = [
    'video/webm; codecs="h264, opus"',
    'video/webm; codecs="h264, aac"',
    'video/webm; codecs=h264',
    'video/mp4; codecs="avc1.42E01E, mp4a.40.2"',
    'video/webm; codecs="vp8, opus"',
    'video/webm'
];
let mimeType = '';
for (const type of supportedTypes) {
    if (MediaRecorder.isTypeSupported(type)) {
        mimeType = type;
        break;
    }
}
const mediaRecorder = new MediaRecorder(combinedStream, mimeType ? { mimeType, videoBitsPerSecond: 3500000 } : undefined);
                        const recordedChunks = [];
                        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };

                        const finishRecording = () => {
                            if (isFinished) return;
                            isFinished = true;
                            if (animFrameId) cancelAnimationFrame(animFrameId);
                            try { video.pause(); } catch(e){}
                            if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
                        };

                        mediaRecorder.onstop = () => {
    try { playAudioCtx.close(); } catch(e){}
    const rawWebmBlob = new Blob(recordedChunks, { type: mimeType || 'video/webm' });
    if (window.ysFixWebmDuration) {
        window.ysFixWebmDuration(rawWebmBlob, finalAudioLength * 1000, (fixedBlob) => {
            resolve(fixedBlob);
        });
    } else {
        resolve(rawWebmBlob);
    }
};

                        mediaRecorder.start(100);
                        video.play();

                        const renderStartTime = performance.now();
                        let currentEventIndex = -1;
                        let activeText = "";

                        let isFreezing = false;
                        let freezeStartTime = 0;
                        let lastFreezeTriggerT = 0;
                        let freezeSnapshotTaken = false;

                        const drawFrame = () => {
                            if (isFinished) return;

                            const elapsedSec = (performance.now() - renderStartTime) / 1000;

                            // 👉 ဒီကုဒ် ၂ ကြောင်းကို အသစ်တိုးထည့်ပါ 👈
                            const realPct = Math.min(100, Math.max(0, Math.floor((elapsedSec / finalAudioLength) * 100)));
                            setRenderPercentage(realPct);

                            if (elapsedSec >= finalAudioLength || video.ended) {
                                finishRecording();
                                return;
                            }

                            const currentEvent = syncTimeline.find(e => elapsedSec >= e.startReal && elapsedSec < e.endReal);

                            if (currentEvent) {
                                activeText = currentEvent.type === 'narrate' ? (currentEvent.text || "") : "";
                                
                                if (currentView === 'recap' && currentEventIndex !== syncTimeline.indexOf(currentEvent)) {
                                    currentEventIndex = syncTimeline.indexOf(currentEvent);
                                    video.playbackRate = currentEvent.vSpeed;

                                    const expectedVTime = currentEvent.vStart + ((elapsedSec - currentEvent.startReal) * currentEvent.vSpeed);
                                    if (Math.abs(video.currentTime - expectedVTime) > 0.8) {
                                        video.currentTime = Math.max(0, Math.min((meta.duration || 10) - 0.05, expectedVTime));
                                    }
                                }
                            } else {
                                activeText = "";
                            }

                            let zoom = 1.0;
                            if (freezeInterval > 0 && currentView === 'recap') {
                                if (!isFreezing && (elapsedSec - lastFreezeTriggerT >= freezeInterval) && (elapsedSec < finalAudioLength - zoomDuration - 0.5)) {
                                    isFreezing = true;
                                    freezeStartTime = elapsedSec;
                                    freezeSnapshotTaken = false;
                                    video.pause();
                                }

                                if (isFreezing) {
                                    if (!freezeSnapshotTaken) {
                                        freezeCtx.drawImage(video, 0, 0, vidW, vidH);
                                        freezeSnapshotTaken = true;
                                    }

                                    const freezeElapsed = elapsedSec - freezeStartTime;
                                    const progress = Math.min(1.0, Math.max(0, freezeElapsed / zoomDuration));
                                    zoom = 1.0 + progress * (zoomIntensity - 1.0);

                                    if (freezeElapsed >= zoomDuration) {
                                        isFreezing = false;
                                        lastFreezeTriggerT = elapsedSec;
                                        video.play();
                                    }
                                }
                            }

                            setRenderProgress(Math.min(75, Math.max(65, Math.floor(65 + (elapsedSec / finalAudioLength) * 10))));

                            ctx.save();

                            }
                            ctx.restore();

                        if (elapsed >= ctaStart) {
                            const ctaT = Math.min(1.0, (elapsed - ctaStart) / 0.35);
                            ctx.save();
                            ctx.translate(cWidth / 2, cHeight * 0.88);
                            ctx.scale(ctaT, ctaT);
                            ctx.fillStyle = '#c59557';
                            ctx.beginPath();
                            ctx.roundRect(-200, -30, 400, 60, 30);
                            ctx.fill();
                            ctx.fillStyle = '#ffffff';

                            ctx.restore();
                        }

})

                    } else {
                        await executeWithApiLogic("Voice Preview", async (apiKey) => {
                            const payload = {
                                contents: [{ parts: [{ text: `Hello, this is a voice preview for ${recapVoice}.` }] }],
                                generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: recapVoice } } } }
                            };
                            const url = apiKey ? `/api/gemini/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}` : `/api/gemini/v1beta/models/gemini-2.5-flash-preview-tts:generateContent`;
                            const res = await apiFetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                            const data = await res.json();
                            const pcmBase64 = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                            if (!pcmBase64) throw new Error("Audio data missing");
                            const bin = atob(pcmBase64); const bytes = new Uint8Array(bin.length);
                            for (let j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
                            const count = Math.floor(bytes.length / 2);
                            const out = new Float32Array(count);
                            for (let k = 0; k < count; k++) {
                                const idx = k * 2;
                                const int16 = (bytes[idx + 1] << 8) | bytes[idx];
                                out[k] = (int16 >= 0x8000 ? int16 - 0x10000 : int16) / 32768.0;
                            }
                            const wav = exportWAV(out, 24000);
                            const audio = new Audio(URL.createObjectURL(wav));

                                            {transactions.map(t => (
                                                <div key={t.id} className={`p-4 rounded-2xl flex justify-between items-center ${neoPressedClass}`}>
                                                    <div><p className="font-bold">{t.email}</p><p className="text-xs text-yellow-500 font-bold">{t.amount?.toLocaleString()} Ks</p>{t.proof && <a href={t.proof} target="_blank" className="text-xs text-indigo-400 underline">ပြေစာကြည့်မည်</a>}</div>
                                                    <div className="flex items-center gap-2">
                                                        <input type="number" defaultValue="30" id={`days_${t.id}`} className={`w-16 p-2 rounded-xl text-xs outline-none text-center ${neoClass}`} title="သက်တမ်းရက်" />
                                                        <span className="text-[10px] opacity-70">ရက်</span>
                                                        <button onClick={async ()=>{ 
                                                            const valid_days = document.getElementById(`days_${t.id}`)?.value || 30;
                                                            await apiFetch('/api/admin/approve', {
                                                                method:'POST',
                                                                headers:{'Content-Type':'application/json'},
                                                                body:JSON.stringify({id:t.id, valid_days})
                                                            });
                                                            loadAdminData();
                                                        }} className="px-4 py-2 bg-green-600 text-white font-bold rounded-xl text-xs">Approve</button>
                                                    </div>
                                                </div>
                                            ))}
                                            {transactions.length === 0 && <p className="opacity-60 text-xs">Pending ငွေလွှဲပြေစာ မရှိပါ။</p>}
                                        </div>
                                    </div>
                                )}

                                {adminTab === 'credits' && (
                                    <div className={`p-6 rounded-3xl space-y-4 ${neoClass}`}>
                                        <h3 className="text-lg font-bold text-purple-400">User များသို့ Credit နှင့် သက်တမ်းရက် သတ်မှတ်ဖြည့်ပေးရန်</h3>
                                        <form onSubmit={async (e) => {
                                            e.preventDefault();
                                            await apiFetch('/api/admin/add-credit', {
                                                method: 'POST',
                                                headers: { 'Content-Type': 'application/json' },
                                                body: JSON.stringify({
                                                    email: manualCredit.email.trim(),
                                                    amount: parseInt(manualCredit.amount),
                                                    valid_days: parseInt(manualCredit.valid_days || 30)
                                                })
                                            });
                                            alert("Credit ဖြည့်သွင်းပြီးပါပြီ။");
                                            setManualCredit({ email: '', amount: 0, valid_days: 30 });
                                            loadAdminData();
                                        }} className="flex flex-col md:flex-row gap-3 items-stretch md:items-center">
                                            <input type="email" value={manualCredit.email} onChange={e => setManualCredit({ ...manualCredit, email: e.target.value })} placeholder="User Email" required className={`flex-1 p-3 rounded-xl outline-none text-xs ${neoPressedClass}`} />
                                            <input type="number" value={manualCredit.amount || ''} onChange={e => setManualCredit({ ...manualCredit, amount: parseInt(e.target.value) })} placeholder="Credit ပမာဏ" required className={`w-36 p-3 rounded-xl outline-none text-xs ${neoPressedClass}`} />
                                            <input type="number" value={manualCredit.valid_days || ''} onChange={e => setManualCredit({ ...manualCredit, valid_days: parseInt(e.target.value) })} placeholder="ရက်ပေါင်း" required className={`w-24 p-3 rounded-xl outline-none text-xs text-center ${neoPressedClass}`} />
                                            <button type="submit" className="px-6 py-3 bg-purple-600 text-white font-bold rounded-xl text-xs shadow-md">Add Credits</button>
                                        </form>
                                    </div>
                                )}
                            </div>
                        )}

                        {selectedOrderToDeliver && (
                            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-[9999]">
                                <div className={`w-full max-w-md p-6 rounded-3xl space-y-4 ${neoClass}`}>
                                    <div className="flex justify-between items-center border-b border-current/10 pb-2">
                                        <h3 className="font-bold text-sm">ပစ္စည်းပို့ဆောင်ခြင်း: {selectedOrderToDeliver.product_name}</h3>
                                        <button onClick={() => setSelectedOrderToDeliver(null)}><XIcon className="w-5 h-5"/></button>
                                    </div>
                                    <form onSubmit={handleDeliverOrder} className="space-y-3 text-xs">
                                        <p><b>User Email:</b> {selectedOrderToDeliver.user_email}</p>
                                        <textarea rows="4" placeholder="ပို့ဆောင်မည့် အကြောင်းအရာ (Account/Password/License Key စသည်ဖြင့် စာရိုက်ပါ)..." value={deliveryMessage} onChange={e=>setDeliveryMessage(e.target.value)} required className={`w-full p-3 rounded-xl outline-none ${neoPressedClass}`}></textarea>
                                        <input type="file" onChange={e=>setDeliveryFile(e.target.files[0])} className="w-full p-2 border border-dashed rounded-xl" />
                                        <button type="submit" className="w-full py-3 bg-amber-500 text-black font-bold rounded-xl shadow-md">User ထံသို့ တိုက်ရိုက် ပို့ဆောင်မည်</button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
