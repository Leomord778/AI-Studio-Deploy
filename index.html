                                                    <div className={`flex items-center justify-between p-5 rounded-2xl ${neoPressedClass}`}><div><div className="text-sm font-bold flex items-center gap-2"><EyeOff className="w-4 h-4 text-indigo-500"/> Auto Blur (မူလစာတန်းဝါးမည်)</div></div><label className="relative inline-flex items-center cursor-pointer"><input type="checkbox" className="sr-only peer" checked={autoBlurCaption} onChange={() => setAutoBlurCaption(!autoBlurCaption)} /><div className={`w-12 h-6 rounded-full peer peer-checked:bg-indigo-500 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-full ${isDark ? 'bg-slate-700' : 'bg-slate-300'}`}></div></label></div>
                                                    <div className={`flex flex-col gap-4 p-5 rounded-2xl ${neoPressedClass}`}>
                                                        <div className="flex items-center justify-between"><div><div className="text-sm font-bold flex items-center gap-2"><Type className="w-4 h-4 text-indigo-500"/> Add Subtitle (စာတန်းထိုးထည့်မည်)</div></div><label className="relative inline-flex items-center cursor-pointer"><input type="checkbox" className="sr-only peer" checked={autoCaption} onChange={() => setAutoCaption(!autoCaption)} /><div className={`w-12 h-6 rounded-full peer peer-checked:bg-indigo-500 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-full ${isDark ? 'bg-slate-700' : 'bg-slate-300'}`}></div></label></div>
                                                        {autoCaption && (
                                                            <div className="mt-2 pt-4 border-t border-current border-opacity-10 space-y-4">
                                                                {!autoBlurCaption && (<div><label className="text-xs font-bold opacity-70 mb-2 block">စာတန်းနေရာ (Position Y)</label><input type="range" min="10" max="95" value={subPosition} onChange={(e) => setSubPosition(e.target.value)} className="w-full accent-indigo-500"/></div>)}
                                                                <div><label className="text-xs font-bold opacity-70 mb-2 block">စာလုံးအရောင် (Text Color)</label><div className="flex gap-2 flex-wrap">{CAPTION_COLORS.map(c => (<button key={c.name} onClick={() => setCaptionColor(c.hex)} className={`w-6 h-6 rounded-full border-2 transition-transform ${captionColor === c.hex ? 'scale-125 border-indigo-500' : 'border-transparent'}`} style={{ backgroundColor: c.hex }} title={c.name}/>))}</div></div>
                                                                <div><label className="text-xs font-bold opacity-70 mb-2 flex justify-between items-center"><span>အနားကွပ်အရောင် (Stroke Color)</span></label><div className="flex gap-2 flex-wrap items-center"><button onClick={() => setStrokeColor('none')} className={`w-6 h-6 rounded-full border-2 flex items-center justify-center transition-transform ${strokeColor === 'none' ? 'scale-125 border-indigo-500 bg-red-500/20 text-red-500' : 'border-transparent bg-slate-500/20 text-slate-500'}`} title="No Stroke"><Slash className="w-4 h-4" /></button><div className="w-px h-6 bg-current opacity-20 mx-1"></div>{CAPTION_COLORS.map(c => (<button key={`stroke-${c.name}`} onClick={() => setStrokeColor(c.hex)} className={`w-6 h-6 rounded-full border-2 transition-transform ${strokeColor === c.hex ? 'scale-125 border-indigo-500' : 'border-transparent'}`} style={{ backgroundColor: c.hex }} title={c.name} />))}</div></div>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>

                                                {errorMsg && (<div className="mb-6 bg-red-500/10 border border-red-500/20 text-red-500 p-4 rounded-xl text-sm font-semibold flex items-start gap-3"><AlertCircle className="w-6 h-6 shrink-0"/> <span className="pt-0.5">{errorMsg}</span></div>)}
                                                <button onClick={() => handleProcess(currentView)} disabled={isRecapProcessing || !videoFile} className={`w-full py-5 rounded-2xl font-black text-lg transition-all flex items-center justify-center gap-3 ${isRecapProcessing || !videoFile ? (isDark ? 'bg-slate-700 text-slate-500' : 'bg-slate-300 text-slate-500') : (currentView === 'recap' ? 'bg-indigo-500 hover:bg-indigo-600' : 'bg-emerald-500 hover:bg-emerald-600') + ' text-white shadow-lg'}`}>{isRecapProcessing ? "စီစဉ်ဆောင်ရွက်နေပါသည်..." : <><Sparkles className="w-6 h-6"/> {currentView === 'recap' ? "One Click-Recap ပြုလုပ်မည်" : "စာတန်းထိုးဗီဒီယို ဖန်တီးမည်"}</>}</button>
                                            </div>
                                        </div>
                                        <div className="lg:col-span-7 flex flex-col gap-6">
                                            {isRecapProcessing && !finalVideoUrl && (<div className={`p-8 rounded-3xl flex flex-col items-center justify-center animate-in fade-in ${neoClass}`}><div className="relative mb-8"><div className={`w-24 h-24 rounded-full border-4 flex items-center justify-center relative ${currentView === 'recap' ? 'border-indigo-500/20' : 'border-emerald-500/20'}`}><div className={`absolute inset-0 border-4 rounded-full border-t-transparent animate-spin ${currentView === 'recap' ? 'border-indigo-500' : 'border-emerald-500'}`}></div><span className={`text-xl font-black ${currentView === 'recap' ? 'text-indigo-500' : 'text-emerald-500'}`}>{renderProgress}%</span></div></div><h3 className="text-2xl font-bold mb-6 tracking-wide text-center">{processStage}<span className="animate-pulse">...</span></h3><div className={`w-full max-w-md h-4 rounded-full overflow-hidden p-1 ${neoPressedClass}`}><div className={`${currentView === 'recap' ? 'bg-indigo-500' : 'bg-emerald-500'} h-full rounded-full transition-all duration-300`} style={{ width: `${renderProgress}%` }}></div></div></div>)}
                                            {systemLogs.length > 0 && !finalVideoUrl && (<div className={`p-4 rounded-2xl text-xs font-mono h-32 overflow-y-auto ${neoPressedClass} ${isDark ? 'text-yellow-400/80' : 'text-orange-600/80'}`}>{systemLogs.map((log, idx) => <div key={idx} className="mb-1 leading-relaxed border-b border-current border-opacity-10 pb-1">{log}</div>)}</div>)}
                                            
                                            <div className={`p-6 rounded-3xl flex-1 flex flex-col min-h-[400px] ${neoClass}`}>
                                                <div className="p-2 mb-4 font-bold opacity-70 flex items-center gap-2">{finalVideoUrl ? <CheckCircle className="w-5 h-5 text-green-500"/> : <Film className={`w-5 h-5 ${currentView === 'recap' ? 'text-indigo-500' : 'text-emerald-500'}`}/>} {finalVideoUrl ? "အပြီးသတ် ဗီဒီယို ဖန်တီးမှု အောင်မြင်ပါသည်" : "ဗီဒီယို မျက်နှာပြင် (Preview)"}</div>
                                                
                                                <div className={`flex-1 rounded-2xl overflow-hidden flex items-center justify-center relative ${neoPressedClass} mx-auto`}
                                                     style={{ 
                                                         aspectRatio: videoRatio === '9:16' ? '9/16' : videoRatio === '1:1' ? '1/1' : '16/9',
                                                         width: videoRatio === '9:16' ? 'auto' : '100%',
                                                         height: videoRatio === '9:16' ? '100%' : 'auto',
                                                         maxHeight: '600px', maxWidth: '100%'
                                                     }}>
                                                    {(!isRecapProcessing || (isRecapProcessing && renderProgress < 80)) && !finalVideoUrl && (videoUrl ? <video src={videoUrl} controls playsInline className={`w-full h-full object-cover transition-all duration-500 ${isRecapProcessing ? 'opacity-30 blur-sm scale-95' : 'opacity-100'}`} style={{ filter: activeFilter }} /> : <div className="opacity-30 flex flex-col items-center p-10"><Film className="w-16 h-16 mb-4"/><p className="font-semibold text-center">ဗီဒီယို တင်လိုက်ပါက<br/>ဤနေရာတွင် ပေါ်လာပါမည်</p></div>)}
                                                    <canvas ref={canvasRef} className={`w-full h-full object-contain transition-all duration-500 ${isRecapProcessing && renderProgress >= 80 && !finalVideoUrl ? 'block blur-md opacity-70 scale-95' : 'hidden'}`} />
                                                    {finalVideoUrl && <video src={previewVideoUrl || finalVideoUrl} controls playsInline preload="metadata" className="w-full h-full object-contain animate-in zoom-in-95 duration-500" />}
                                                </div>
                                                {finalVideoUrl && (<button onClick={downloadFinalFile} className="w-full mt-6 py-5 bg-green-500 hover:bg-green-600 text-white font-black text-lg rounded-2xl flex items-center justify-center gap-3 transition-colors shadow-lg shadow-green-500/40"><Download className="w-6 h-6" /> MP4 ဗီဒီယိုကို ဒေါင်းလုဒ်ဆွဲမည် (Credits နုတ်မည်)</button>)}
                                            </div>

                                            {finalVideoUrl && (
                                                <div className={`p-6 rounded-3xl mt-6 ${neoClass}`}>
                                                    <div className="flex justify-between items-center mb-6">
                                                        <h3 className="text-xl font-bold flex items-center gap-2 text-indigo-500"><Type className="w-6 h-6"/> Social Media Kit</h3>
                                                        {!socialContent && <button onClick={generateSocialContent} disabled={isGeneratingSocial} className={`px-4 py-2 bg-indigo-500 text-white rounded-lg font-bold text-sm ${isGeneratingSocial?'opacity-50':''}`}>{isGeneratingSocial ? 'Generating...' : 'Auto Generate Post'}</button>}
                                                    </div>
                                                    
                                                    {socialContent && (
                                                        <div>
                                                            <div className="flex gap-4 border-b border-gray-600 mb-4">
                                                                {['youtube', 'tiktok', 'facebook'].map(tab => (
                                                                    <button key={tab} onClick={() => setActiveSocialTab(tab)} className={`pb-2 capitalize font-bold transition ${activeSocialTab === tab ? 'text-indigo-500 border-b-2 border-indigo-500' : 'opacity-50'}`}>{tab}</button>
                                                                ))}
                                                            </div>
                                                            <div className={`p-4 rounded-xl text-sm leading-relaxed ${neoPressedClass}`}>
                                                                <div className="flex justify-between items-start mb-2"><h4 className="font-bold text-lg">{socialContent[activeSocialTab]?.title}</h4><button onClick={() => {navigator.clipboard.writeText(`${socialContent[activeSocialTab]?.title}\n\n${socialContent[activeSocialTab]?.desc}\n\n${socialContent[activeSocialTab]?.tags}`); alert('Copied!');}} className={`p-2 rounded-lg ${neoBtnClass}`}><Copy className="w-4 h-4"/></button></div>
                                                                <p className="mb-4 opacity-80">{socialContent[activeSocialTab]?.desc}</p>
                                                                <p className="text-indigo-400 font-bold">{socialContent[activeSocialTab]?.tags}</p>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {currentView === 'tts' && (
                            <div className={`min-h-screen font-sans p-4 md:p-8 relative pb-10 transition-colors duration-300 ${isDark ? 'text-slate-200' : 'text-slate-800'}`}>
                                <div className="max-w-6xl mx-auto space-y-8 relative">
                                    {renderTopNavigation("Text to Speech", <Mic className="w-8 h-8 text-rose-500"/>)}
                                    {renderSettingsPanel()}
                                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                                        <div className="lg:col-span-5 flex flex-col gap-6">
                                            <div className={`p-6 md:p-8 rounded-3xl ${neoClass}`}>
                                                <h2 className="text-xl font-bold mb-6 flex items-center gap-3"><Sliders className="w-6 h-6 text-rose-500" /> အသံ ချိန်ညှိမှုများ</h2>
                                                <div className="mb-6"><label className="block text-sm font-semibold mb-3 opacity-80">🎙️ Voiceover Engine & Model</label><div className="flex flex-col md:flex-row gap-3 mb-4"><button type="button" onClick={() => setTtsEngine('gemini')} className={`flex-1 py-3 rounded-xl font-bold transition-all ${ttsEngine === 'gemini' ? 'bg-rose-500 text-white' : neoPressedClass}`}>Gemini TTS</button><button type="button" onClick={() => setTtsEngine('edge')} className={`flex-1 py-3 rounded-xl font-bold transition-all ${ttsEngine === 'edge' ? 'bg-rose-500 text-white' : neoPressedClass}`}>Edge TTS</button></div><div className="flex gap-3"><select value={ttsVoice} onChange={(e) => setTtsVoice(e.target.value)} className={`flex-1 px-5 py-4 rounded-xl outline-none font-medium appearance-none cursor-pointer ${neoPressedClass}`}>{(ttsEngine === 'edge' ? EDGE_VOICES : GEMINI_VOICES).map(v => <option key={v.id} value={v.id}>{v.name || v.id} - ({v.gender})</option>)}</select><button onClick={() => playVoicePreview(ttsEngine, ttsVoice)} disabled={previewingAudio} className={`px-5 rounded-xl flex items-center justify-center gap-2 ${neoBtnClass}`} title="Preview">{previewingAudio ? <Loader2 className="w-5 h-5 animate-spin text-rose-500"/> : <Volume2 className="w-5 h-5 text-rose-500" />}</button></div></div>
                                                <div className="mb-6"><label className="block text-sm font-semibold mb-3 opacity-80">🎭 လေသံ အမျိုးအစား (10 Styles)</label><div className="grid grid-cols-2 gap-3 max-h-64 overflow-y-auto pr-2 pb-2">{VOICE_STYLES.map(style => (<button key={style.id} onClick={() => setTtsStyleObj(style)} className={`p-3 rounded-xl text-xs font-semibold text-left flex items-center gap-2 transition-all ${ttsStyleObj.id === style.id ? 'bg-rose-500 text-white shadow-md' : neoPressedClass}`}><span className="text-xl">{style.emoji}</span> <span className="truncate">{style.name.split(' ')[0]}</span></button>))}</div></div>
                                                {ttsError && (<div className="mb-6 bg-red-500/10 border border-red-500/20 text-red-500 p-4 rounded-xl text-sm font-semibold flex items-start gap-3"><AlertCircle className="w-6 h-6 shrink-0"/> <span className="pt-0.5">{ttsError}</span></div>)}
                                                <button onClick={handleGenerateTTS} disabled={isTtsGenerating || !ttsTextInput.trim()} className={`w-full py-5 rounded-2xl font-black text-lg transition-all flex items-center justify-center gap-3 ${isTtsGenerating || !ttsTextInput.trim() ? (isDark ? 'bg-slate-700 text-slate-500' : 'bg-slate-300 text-slate-500') : 'bg-rose-500 hover:bg-rose-600 text-white shadow-lg shadow-rose-500/40'}`}>{isTtsGenerating ? "ဖန်တီးနေပါသည်..." : <><Mic className="w-6 h-6"/> Generate Voice</>}</button>
                                            </div>
                                        </div>
                                        <div className="lg:col-span-7 flex flex-col gap-6">
                                            <div className={`p-6 rounded-3xl flex-1 flex flex-col min-h-[500px] ${neoClass}`}>
                                                <div className="flex justify-between items-center mb-4"><div className="font-bold opacity-70 flex items-center gap-2"><Type className="w-5 h-5 text-rose-500"/> စာရိုက်ထည့်ရန်</div><div className={`text-xs font-bold px-3 py-1 rounded-full ${ttsTextInput.length >= 10000 ? 'text-red-500' : 'opacity-60'}`}>{ttsTextInput.length} / 10000</div></div>
                                                <textarea value={ttsTextInput} onChange={(e) => setTtsTextInput(e.target.value)} maxLength={10000} placeholder="လူစကားပြောအသံအဖြစ် ပြောင်းလဲလိုသော စာများကို ဤနေရာတွင် ရိုက်ထည့်ပါ..." className={`flex-1 w-full p-6 rounded-2xl resize-none outline-none text-base leading-relaxed ${neoPressedClass}`}></textarea>
                                                <div className="mt-6">
                                                    {isTtsGenerating && (<div className={`p-6 rounded-2xl mb-6 animate-in fade-in ${neoPressedClass}`}><div className="flex justify-between text-sm font-bold mb-3"><span className="text-rose-500">{ttsProgressTxt}</span><span>{ttsProgressPct}%</span></div><div className="w-full h-3 rounded-full overflow-hidden bg-opacity-20 bg-current"><div className="bg-rose-500 h-full rounded-full transition-all duration-300" style={{ width: `${ttsProgressPct}%` }}></div></div></div>)}
                                                    {ttsAudioUrl && !isTtsGenerating && (<div className={`p-6 rounded-2xl animate-in fade-in zoom-in flex flex-col gap-4 ${neoPressedClass}`}><div className="flex items-center gap-3 font-bold text-green-500"><CheckCircle className="w-6 h-6"/> အောင်မြင်စွာ ဖန်တီးပြီးပါပြီ!</div><audio src={ttsAudioUrl} controls className="w-full h-14 rounded-xl outline-none" /><button onClick={downloadTtsAudio} className="w-full py-4 bg-green-500 hover:bg-green-600 text-white font-bold rounded-xl flex items-center justify-center gap-2 transition-colors shadow-lg mt-2"><Download className="w-5 h-5" /> အသံဖိုင်ကို ဒေါင်းလုဒ်ဆွဲမည် (MP3/WAV)</button></div>)}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
