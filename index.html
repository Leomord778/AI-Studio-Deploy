        (function() {
            const NativeWorker = window.Worker;
            window.Worker = function(scriptURL, options) {
                const urlStr = (scriptURL instanceof URL) ? scriptURL.href : String(scriptURL);
                if (urlStr.startsWith('http://') || urlStr.startsWith('https://')) {
                    if (!urlStr.startsWith(window.location.origin)) {
                        const blob = new Blob([`importScripts(${JSON.stringify(urlStr)});`], { type: 'text/javascript' });
                        return new NativeWorker(URL.createObjectURL(blob), options);
                    }
                }
                return new NativeWorker(scriptURL, options);
            };
            window.Worker.prototype = NativeWorker.prototype;
        })();
    </script>

        const blobToBase64 = (blob) => new Promise((resolve, reject) => {

            reader.readAsDataURL(blob);

        const parseSrtBlocks = (srt) => {
            if (!srt) return [];
            const blocks = srt.replace(/\r\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim().split(/\n\n+/);
            return blocks.map(block => {
                const lines = block.split('\n');
                const timeIdx = lines.findIndex(l => l.includes('-->'));
                if (timeIdx === -1) return null;
                const m = lines[timeIdx].match(/(\d+):(\d{2}):(\d{2})[,.](\d+)\s*-->\s*(\d+):(\d{2}):(\d{2})[,.](\d+)/);
                if (!m) return null;
                const start = +m[1]*3600 + +m[2]*60 + +m[3] + +m[4]/(m[4].length === 2 ? 100 : 1000);
                const end = +m[5]*3600 + +m[6]*60 + +m[7] + +m[8]/(m[8].length === 2 ? 100 : 1000);
                const text = lines.slice(timeIdx + 1).join(' ').replace(/<[^>]+>/g, '').trim();
                return { start, end, text };
            }).filter(b => b && b.text);
        };

        const parseGeminiCandidateText = (d) => {

            }
            return text.replace(/^```(json)?\n?/i, '').replace(/\n```$/i, '').trim();

        const writeString = (view, offset, str) => { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); };
        const exportWAV = (channelData, sampleRate) => {
            const buffer = new ArrayBuffer(44 + channelData.length * 2);
            const view = new DataView(buffer);
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + channelData.length * 2, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(view, 36, 'data');
            view.setUint32(40, channelData.length * 2, true);
            let offset = 44;
            for (let i = 0; i < channelData.length; i++, offset += 2) {
                const s = Math.max(-1, Math.min(1, channelData[i]));
                view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }
            return new Blob([view], { type: 'audio/wav' });
        };

        function wrapMyanmarText(ctx, text, maxWidth) {
            const words = text.includes(' ') ? text.split(' ') : text.match(/.{1,10}/g) || [text];
            const lines = [];
            let currentLine = '';

            for (let i = 0; i < words.length; i++) {
                const word = words[i];
                const testLine = currentLine ? currentLine + (text.includes(' ') ? ' ' : '') + word : word;
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && i > 0) {
                    lines.push(currentLine);
                    currentLine = word;
                } else {
                    currentLine = testLine;
                }
            }
            if (currentLine) lines.push(currentLine);
            return lines;
        }

        async function fetchWithProgress(url, onProgress) {
            const response = await fetch(url);
            const contentLength = response.headers.get('content-length');
            const total = contentLength ? parseInt(contentLength, 10) : 0;
            let loaded = 0;
            const reader = response.body.getReader();
            const chunks = [];
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                loaded += value.length;
                if (total > 0 && onProgress) {
                    onProgress(Math.min(1.0, loaded / total));
                }
            }
            const allChunks = new Uint8Array(loaded);
            let position = 0;
            for (const chunk of chunks) {
                allChunks.set(chunk, position);
                position += chunk.length;
            }

            const handleCredentialResponse = (response) => {

            const addSysLog = (msg) => setSystemLogs(prev => [...prev, `${new Date().toLocaleTimeString()} - ${msg}`]);

            const executeWithApiLogic = async (operationName, requestFn) => {
                const validKeys = geminiKeys.filter(k => k.trim() !== '');
                let attempts = 0;
                let currentIndex = activeKeyIndex;
                const totalKeys = validKeys.length;

                while (attempts < Math.max(1, totalKeys)) {
                    const currentKey = validKeys[currentIndex] || "";
                    try {
                        return await requestFn(currentKey);
                    } catch (error) {
                        addSysLog(`[Warning] ${operationName} error: ${error.message}. Trying next available key...`);
                        if (totalKeys > 0) {
                            currentIndex = (currentIndex + 1) % totalKeys;
                            setActiveKeyIndex(currentIndex);
                        }
                        attempts++;
                        if (attempts >= Math.max(1, totalKeys)) return await requestFn("");

                }
            };

            const runFFmpeg = async (args) => {

            // Client-side compression ဖျက်ထားပြီး မူရင်းဖိုင်အတိုင်း တိုက်ရိုက် load ပြုလုပ်ပါသည်
            const handleVideoUpload = (e) => {

            const performTranscription = async () => {
                setProgressStage("ဗီဒီယိုထဲမှ အသံဖိုင်အား Native Audio Engine ဖြင့် ထုတ်ယူနေသည်");

                let fullWavBlob = null;
                try {

                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const decodedBuffer = await audioCtx.decodeAudioData(arrayBuffer);

                    const offlineCtx = new OfflineAudioContext(1, Math.ceil(decodedBuffer.duration * 16000), 16000);
                    const srcNode = offlineCtx.createBufferSource();
                    srcNode.buffer = decodedBuffer;
                    srcNode.connect(offlineCtx.destination);
                    srcNode.start(0);

                    const renderedBuffer = await offlineCtx.startRendering();
                    fullWavBlob = exportWAV(renderedBuffer.getChannelData(0), 16000);
                    audioCtx.close();
                } catch (decodeErr) {
                    addSysLog(`Native Audio decode အဆင်မပြေသဖြင့် FFmpeg ဖြင့် အရန်ထုတ်ယူပါမည်...`);
                    const ffmpeg = ffmpegRef.current;

                    await runFFmpeg(['-i', 'audio_src.mp4', '-ac', '1', '-ar', '16000', 'out_audio.wav']);
                    const wavData = await ffmpeg.readFile('out_audio.wav');
                    fullWavBlob = new Blob([wavData.buffer], { type: 'audio/wav' });
                    try { await ffmpeg.deleteFile('audio_src.mp4'); } catch(e){}
                    try { await ffmpeg.deleteFile('out_audio.wav'); } catch(e){}
                }

                setProgressStage("Transcriptထုတ်ယူနေသည်");
                setRenderProgress(25);
                addSysLog("Groq Whisper API သို့ အသံဖိုင် ပေးပို့နေပါသည်...");

                const formData = new FormData();
                formData.append('file', new File([fullWavBlob], 'audio.wav', { type: 'audio/wav' }));
                formData.append('model', 'whisper-large-v3-turbo');
                formData.append('response_format', 'verbose_json');

                try {
                    const res = await apiFetch('/api/groq/transcriptions', { method: 'POST', body: formData });
                    const data = await res.json();

                    if (res.ok && Array.isArray(data.segments) && data.segments.length > 0) {
                        addSysLog(`Groq Whisper မှ Segments (${data.segments.length}) ခု အောင်မြင်စွာ ရယူပြီးပါပြီ။`);
                        return jsonToSrt(data.segments.map(seg => ({
                            start: Number(seg.start),

                        })));
                    } else {
                        throw new Error(data.error || "Groq STT အဖြေ မရရှိပါ");

                } catch (groqErr) {
                    addSysLog(`[သတိပေးချက်] Groq Whisper Error (${groqErr.message}) - Gemini Proxy ဖြင့် အရန်ပြောင်းလဲ ဖတ်ယူနေပါသည်...`);
                    const base64Audio = await blobToBase64(fullWavBlob);
                    const fallbackSegments = await executeWithApiLogic("Gemini Transcription Fallback", async (apiKey) => {
                        const payload = {
                            contents: [{
                                parts: [
                                    { text: "Transcribe this audio accurately. Output ONLY a valid JSON array of objects with keys: 'start' (float seconds), 'end' (float seconds), 'text' (transcribed text string)." },
                                    { inlineData: { mimeType: "audio/wav", data: base64Audio } }
                                ]
                            }],
                            generationConfig: { temperature: 0.1, responseMimeType: "application/json" }
                        };
                        const url = apiKey ? `/api/gemini/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}` : `/api/gemini/v1beta/models/gemini-2.5-flash:generateContent`;
                        const r = await apiFetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                        const d = await r.json();
                        return JSON.parse(parseGeminiCandidateText(d));
                    });

                    if (Array.isArray(fallbackSegments) && fallbackSegments.length > 0) {
                        addSysLog(`Gemini မှ Segments (${fallbackSegments.length}) ခု အောင်မြင်စွာ ရယူပြီးပါပြီ။`);
                        return jsonToSrt(fallbackSegments.map(seg => ({
                            start: Number(seg.start),
                            end: Number(seg.end),
                            text: seg.text || ""
                        })));
                    } else {
                        throw new Error("စာသား ထုတ်ယူမရပါ။ Groq API Key သို့မဟုတ် ကွန်ရက်လိုင်းကို စစ်ဆေးပေးပါ။");
                    }
                }
            };

            const performTranslation = async (originalSrt) => {
                setProgressStage("ဘာသာပြန်script ထုတ်နေပါသည်");
                addSysLog(`Gemini ဖြင့် မြန်မာဘာသာသို့ အဖြတ်အတောက် သတ်ပုံမှန်ကန်စွာ ဘာသာပြန်နေပါသည်...`);
                const originalBlocks = parseSrtBlocks(originalSrt).map((b, i) => ({ id: i + 1, start: b.start, end: b.end, text: b.text }));
                let allTranslated = [];
                const BATCH_SIZE = 12;

                for (let i = 0; i < originalBlocks.length; i += BATCH_SIZE) {
                    const batch = originalBlocks.slice(i, i + BATCH_SIZE);
                    const translatedBatch = await executeWithApiLogic("Translation", async (apiKey) => {
                        const payload = {
                            contents: [{ parts: [{ text: JSON.stringify(batch) }] }],
                            systemInstruction: { parts: [{ text: `You are an expert movie recap narrator. Translate the 'text' field into fluent, captivating ${selectedLang} with natural spoken phrasing and correct Myanmar spelling. Convert all numbers to spoken Myanmar words (e.g. '1000' -> 'တစ်ထောင်'). Keep 'id', 'start', and 'end' values identical. Output ONLY a valid JSON array.` }] },
                            generationConfig: { temperature: 0.2, responseMimeType: "application/json" }
                        };
                        const url = apiKey ? `/api/gemini/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}` : `/api/gemini/v1beta/models/gemini-2.5-flash:generateContent`;
                        const res = await apiFetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                        const data = await res.json();
                        return JSON.parse(parseGeminiCandidateText(data));
                    });

                    for (let j = 0; j < batch.length; j++) {
                        const item = Array.isArray(translatedBatch) ? translatedBatch.find(x => x.id === batch[j].id) : null;
                        allTranslated.push(item && item.text ? item : batch[j]);
                    }
                    setRenderProgress(Math.min(45, Math.floor(25 + (20 * ((i + BATCH_SIZE) / originalBlocks.length)))));
                }
                return allTranslated;
            };

            const performTTSGeneration = async (translatedBlocks) => {
                setProgressStage("Voiceover ထုတ်နေပါသည်");
                addSysLog(`${recapEngine === 'edge' ? recapVoice : 'Gemini TTS'} ဖြင့် Voiceover ထုတ်ယူပြီး Timeline တွက်ချက်နေပါသည်...`);
                
                const tempAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const processedChunks = [];

                for (let i = 0; i < translatedBlocks.length; i++) {
                    const block = translatedBlocks[i];
                    let text = block.text?.trim() || " ";
                    let audioBuffer = null;
                    let actualDur = Math.max(0.5, block.end - block.start);

                    try {
                        if (recapEngine === 'edge') {
                            const response = await apiFetch('/api/tts', { 
                                method: 'POST', 
                                headers: { 'Content-Type': 'application/json' }, 
                                body: JSON.stringify({ text, voice: recapVoice, rate: "+10%" }) 
                            });
                            const mp3Blob = await response.blob();
                            audioBuffer = await tempAudioCtx.decodeAudioData(await mp3Blob.arrayBuffer());
                            actualDur = audioBuffer.duration;
                        } else {
                            await executeWithApiLogic(`TTS Chunk`, async (apiKey) => {
                                const payload = {
                                    contents: [{ parts: [{ text: text }] }],
                                    generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: recapVoice } } } }
                                };
                                const url = apiKey ? `/api/gemini/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}` : `/api/gemini/v1beta/models/gemini-2.5-flash-preview-tts:generateContent`;
                                const res = await apiFetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                                const data = await res.json();
                                const pcmBase64 = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                                if (!pcmBase64) throw new Error("Audio missing");

                                const bin = atob(pcmBase64); 
                                const bytes = new Uint8Array(bin.length);
                                for (let j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
                                const count = Math.floor(bytes.length / 2);
                                
                                const offlineCtx = new OfflineAudioContext(1, count, 24000);
                                audioBuffer = offlineCtx.createBuffer(1, count, 24000);
                                const out = audioBuffer.getChannelData(0);
                                for (let k = 0; k < count; k++) {
                                    const idx = k * 2;
                                    const int16 = (bytes[idx + 1] << 8) | bytes[idx];
                                    out[k] = (int16 >= 0x8000 ? int16 - 0x10000 : int16) / 32768.0;
                                }
                                actualDur = Math.max(0.1, count / 24000);
                            });
                        }
                    } catch (e) {
                        const offlineCtx = new OfflineAudioContext(1, 24000, 24000);
                        audioBuffer = offlineCtx.createBuffer(1, 24000, 24000);
                        actualDur = 1.0;
                    }

                    processedChunks.push({
                        vStart: block.start,
                        vEnd: block.end,
                        text: block.text,
                        audioBuffer,
                        audioDur: actualDur
                    });

                    setRenderProgress(Math.min(60, Math.floor(45 + ((i + 1) / translatedBlocks.length) * 15)));
                }

                // Adaptive Retiming: အသံနှင့် ဗီဒီယို အံဝင်ခွင်ကျဖြစ်အောင် Speed တွက်ချက်ခြင်း
                let currentRealTime = 0;
                const syncTimeline = processedChunks.map(chunk => {
                    const startReal = currentRealTime;
                    const endReal = startReal + chunk.audioDur;
                    currentRealTime = endReal;

                    // မူရင်း ဗီဒီယို အရှည်
                    const vDuration = Math.max(0.1, chunk.vEnd - chunk.vStart);
                    
                    // အသံကြာချိန်နှင့် အံဝင်ခွင်ကျဖြစ်မည့် ဗီဒီယို အမြန်နှုန်း (Speed) ကို တွက်ချက်ခြင်း
                    const calculatedSpeed = Math.max(0.35, Math.min(2.0, vDuration / chunk.audioDur));

                    return {
                        type: 'narrate',
                        startReal: startReal,
                        endReal: endReal,
                        vStart: chunk.vStart,
                        vEnd: chunk.vEnd,
                        vSpeed: calculatedSpeed,
                        text: chunk.text,
                        audioBuffer: chunk.audioBuffer,
                        durationReal: chunk.audioDur
                    };
                });

                const totalAudioDur = currentRealTime > 0 ? currentRealTime : 10;
                tempAudioCtx.close();
                return { syncTimeline, totalAudioDur };
            };

            const renderToWebM = async (syncData, videoSrcUrl, meta) => {
                return new Promise(async (resolve, reject) => {
                    let animFrameId = null;
                    let isFinished = false;

                    try {
                        const { syncTimeline, totalAudioDur } = syncData;
                        setProgressStage("Creating Video");
                        setRenderProgress(65);

                        const sampleRate = 44100;
                        const finalAudioLength = currentView === 'recap' ? Math.max(totalAudioDur, meta.duration || 10) : meta.duration;

                        const video = document.createElement('video');
                        video.src = videoSrcUrl;
                        video.crossOrigin = "anonymous";
                        video.muted = (currentView === 'recap');
                        video.playsInline = true;

                        await new Promise((res, rej) => {
                            video.onloadeddata = res;
                            video.onerror = rej;
                        });

                        const playAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        if (playAudioCtx.state === 'suspended') await playAudioCtx.resume();
                        const dest = playAudioCtx.createMediaStreamDestination();

                        if (currentView === 'subtitle') {
                            const vidSourceNode = playAudioCtx.createMediaElementSource(video);
                            vidSourceNode.connect(dest);
                        } else {
                            const offlineCtx = new OfflineAudioContext(2, Math.ceil(finalAudioLength * sampleRate), sampleRate);
                            syncTimeline.forEach(event => {
                                if (event.type === 'narrate' && event.audioBuffer) {
                                    const src = offlineCtx.createBufferSource();
                                    src.buffer = event.audioBuffer;
                                    src.playbackRate.value = 1.0;
                                    src.connect(offlineCtx.destination);
                                    src.start(event.startReal);
                                }
                            });

                            if (bgMusicFile) {
                                const tempAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                                const bgArrBuf = await bgMusicFile.arrayBuffer();
                                const bgDecoded = await tempAudioCtx.decodeAudioData(bgArrBuf);
                                const bgSrc = offlineCtx.createBufferSource();
                                bgSrc.buffer = bgDecoded;
                                bgSrc.loop = true;
                                const bgGain = offlineCtx.createGain();
                                bgGain.gain.value = bgMusicVolume / 100;
                                bgSrc.connect(bgGain);
                                bgGain.connect(offlineCtx.destination);
                                bgSrc.start(0);
                                tempAudioCtx.close();
                            }

                            const masterAudioBuffer = await offlineCtx.startRendering();
                            const singleMasterSource = playAudioCtx.createBufferSource();
                            singleMasterSource.buffer = masterAudioBuffer;
                            singleMasterSource.connect(dest);
                            singleMasterSource.start(0);
                        }

                        const canvas = document.createElement('canvas');
                        
                        // 720p Resolution သတ်မှတ်ခြင်း (Landscape/Portrait အလိုက် အချိုးကျ scale လုပ်သည်)
                        const originalW = meta.width || 1280;
                        const originalH = meta.height || 720;
                        const scaleFactor = Math.min(1280 / originalW, 720 / originalH);
                        const vidW = Math.floor((originalW * scaleFactor) / 2) * 2;
                        const vidH = Math.floor((originalH * scaleFactor) / 2) * 2;

                        canvas.width = vidW;
                        canvas.height = vidH;
                        const ctx = canvas.getContext('2d');

                        const freezeCanvas = document.createElement('canvas');
                        freezeCanvas.width = vidW;
                        freezeCanvas.height = vidH;
                        const freezeCtx = freezeCanvas.getContext('2d');

                        // 18 FPS Stream သတ်မှတ်ခြင်း
                        const canvasStream = canvas.captureStream(18);
                        const combinedStream = new MediaStream([
                            ...canvasStream.getVideoTracks(),
                            ...dest.stream.getAudioTracks()
                        ]);

                        const mimeType = MediaRecorder.isTypeSupported('video/webm; codecs=vp8,opus')
                            ? 'video/webm; codecs=vp8,opus'
                            : (MediaRecorder.isTypeSupported('video/webm') ? 'video/webm' : '');

                        const mediaRecorder = new MediaRecorder(combinedStream, mimeType ? { mimeType, videoBitsPerSecond: 3500000 } : undefined);
                        const recordedChunks = [];
                        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };

                        const finishRecording = () => {
                            if (isFinished) return;
                            isFinished = true;
                            if (animFrameId) cancelAnimationFrame(animFrameId);
                            try { video.pause(); } catch(e){}
                            if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
                        };

                        mediaRecorder.onstop = () => {
                            try { playAudioCtx.close(); } catch(e){}
                            const webmBlob = new Blob(recordedChunks, { type: 'video/webm' });
                            resolve(webmBlob);
                        };

                        mediaRecorder.start(100);
                        video.play();

                        const renderStartTime = performance.now();
                        let currentEventIndex = -1;
                        let activeText = "";

                        let isFreezing = false;
                        let freezeStartTime = 0;
                        let lastFreezeTriggerT = 0;
                        let freezeSnapshotTaken = false;

                        const drawFrame = () => {
                            if (isFinished) return;

                            const elapsedSec = (performance.now() - renderStartTime) / 1000;

                            if (elapsedSec >= finalAudioLength || video.ended) {
                                finishRecording();
                                return;
                            }

                            const currentEvent = syncTimeline.find(e => elapsedSec >= e.startReal && elapsedSec < e.endReal);

                            if (currentEvent) {
                                activeText = currentEvent.text || "";
                                
                                if (currentView === 'recap' && currentEventIndex !== syncTimeline.indexOf(currentEvent)) {
                                    currentEventIndex = syncTimeline.indexOf(currentEvent);
                                    video.playbackRate = currentEvent.vSpeed;
                                    if (Math.abs(video.currentTime - currentEvent.vStart) > 1.0) {
                                        video.currentTime = Math.max(0, Math.min((meta.duration || 10) - 0.05, currentEvent.vStart));
                                    }
                                }
                            } else {
                                activeText = "";
                            }

                            let zoom = 1.0;
                            if (freezeInterval > 0 && currentView === 'recap') {
                                if (!isFreezing && (elapsedSec - lastFreezeTriggerT >= freezeInterval) && (elapsedSec < finalAudioLength - zoomDuration - 0.5)) {
                                    isFreezing = true;
                                    freezeStartTime = elapsedSec;
                                    freezeSnapshotTaken = false;
                                    video.pause();
                                }

                                if (isFreezing) {
                                    if (!freezeSnapshotTaken) {
                                        freezeCtx.drawImage(video, 0, 0, vidW, vidH);
                                        freezeSnapshotTaken = true;
                                    }

                                    const freezeElapsed = elapsedSec - freezeStartTime;
                                    const progress = Math.min(1.0, Math.max(0, freezeElapsed / zoomDuration));
                                    zoom = 1.0 + progress * (zoomIntensity - 1.0);

                                    if (freezeElapsed >= zoomDuration) {
                                        isFreezing = false;
                                        lastFreezeTriggerT = elapsedSec;
                                        video.play();
                                    }
                                }
                            }

                            setRenderProgress(Math.min(75, Math.max(65, Math.floor(65 + (elapsedSec / finalAudioLength) * 10))));

                            ctx.save();
                            if (mirrorVideo) {
                                ctx.translate(vidW, 0);
                                ctx.scale(-1, 1);
                            }

                            const bVal = manualAdjust.b;
                            const cVal = manualAdjust.c;
                            const sVal = manualAdjust.s;
                            ctx.filter = `brightness(${bVal}%) contrast(${cVal}%) saturate(${sVal}%) ${activeFilter !== 'none' ? activeFilter : ''}`;

                            const drawW = vidW * zoom;
                            const drawH = vidH * zoom;
                            const offsetX = (vidW - drawW) / 2;
                            const offsetY = (vidH - drawH) / 2;

                            if (isFreezing) {
                                ctx.drawImage(freezeCanvas, offsetX, offsetY, drawW, drawH);
                            } else {
                                ctx.drawImage(video, 0, 0, vidW, vidH);
                            }
                            ctx.restore();

                            if (autoBlurCaption) {
                                const origBx = vidW * manualBlurBox.xMin;
                                const origBy = vidH * manualBlurBox.yMin;
                                const origBw = vidW * (manualBlurBox.xMax - manualBlurBox.xMin);
                                const origBh = vidH * (manualBlurBox.yMax - manualBlurBox.yMin);

                                const centerBx = origBx + origBw / 2;
                                const centerBy = origBy + origBh / 2;

                                const zoomedBw = origBw * zoom;
                                const zoomedBh = origBh * zoom;

                                const zoomedBx = (centerBx - vidW / 2) * zoom + vidW / 2 - zoomedBw / 2;
                                const zoomedBy = (centerBy - vidH / 2) * zoom + vidH / 2 - zoomedBh / 2;

                                const finalBx = Math.max(0, zoomedBx);
                                const finalBy = Math.max(0, zoomedBy);
                                const finalBw = Math.min(vidW - finalBx, zoomedBw);
                                const finalBh = Math.min(vidH - finalBy, zoomedBh);

                                ctx.save();
                                ctx.filter = 'blur(16px)';
                                ctx.drawImage(canvas, finalBx, finalBy, finalBw, finalBh, finalBx, finalBy, finalBw, finalBh);
                                ctx.restore();
                            }

                            if (autoCaption && activeText) {
                                const baseFontSize = Math.max(16, Math.round(vidH * 0.035 * subSize));
                                ctx.font = `700 ${baseFontSize}px 'Pyidaungsu', 'Inter', sans-serif`;
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'middle';

                                const maxSubWidth = vidW * 0.85;
                                const lines = wrapMyanmarText(ctx, activeText, maxSubWidth);
                                const lineHeight = baseFontSize * 1.3;

                                const targetY = autoBlurCaption 
                                    ? vidH * ((manualBlurBox.yMin + manualBlurBox.yMax) / 2) 
                                    : vidH * (subPosition / 100);

                                const startY = targetY - ((lines.length - 1) * lineHeight) / 2;

                                lines.forEach((line, lineIdx) => {
                                    const posY = startY + (lineIdx * lineHeight);
                                    const posX = vidW / 2;

                                    if (strokeColor !== 'none') {
                                        ctx.strokeStyle = strokeColor;
                                        ctx.lineWidth = Math.max(3, baseFontSize * 0.1);
                                        ctx.lineJoin = 'round';
                                        ctx.strokeText(line, posX, posY);
                                    }

                                    ctx.fillStyle = captionColor;
                                    ctx.fillText(line, posX, posY);
                                });
                            }

                            animFrameId = requestAnimationFrame(drawFrame);
                        };

                        animFrameId = requestAnimationFrame(drawFrame);
                    } catch (err) {
                        reject(err);
                    }
                });
            };

            const convertWebmToMp4 = async (webmBlob) => {

                setProgressStage("Sending Final Video(Please wait)...");
                setRenderProgress(75);
                addSysLog("FFmpeg WASM ဖြင့် 720p 18 FPS MP4 သို့ Remux ပြုလုပ်နေပါသည်...");

                const progressHandler = ({ progress }) => {
                    if (typeof progress === 'number' && !isNaN(progress) && progress > 0) {
                        const pct = Math.min(94, Math.max(75, Math.round(75 + progress * 19)));
                        setRenderProgress(pct);
                    }
                };

                ffmpeg.on('progress', progressHandler);

                try {
                    await ffmpeg.writeFile('input.webm', await window.FFmpegUtil.fetchFile(webmBlob));

                    await runFFmpeg([
                        '-i', 'input.webm',
                        '-vf', 'scale=trunc(iw*min(1280/iw\\,720/ih)/2)*2:trunc(ih*min(1280/iw\\,720/ih)/2)*2',
                        '-r', '18',
                        '-c:v', 'libx264',
                        '-preset', 'ultrafast',
                        '-tune', 'fastdecode',
                        '-crf', '24',
                        '-pix_fmt', 'yuv420p',
                        '-c:a', 'aac',
                        '-b:a', '160k',
                        '-movflags', '+faststart',
                        'final_output.mp4'
                    ]);

                    setProgressStage("ဖိုင် အပြီးသတ် ထုတ်ယူနေပါသည် (95%)...");
                    setRenderProgress(95);

                    } else {
                        await executeWithApiLogic("Voice Preview", async (apiKey) => {
                            const payload = {
                                contents: [{ parts: [{ text: `Hello, this is a voice preview for ${recapVoice}.` }] }],
                                generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: recapVoice } } } }
                            };
                            const url = apiKey ? `/api/gemini/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}` : `/api/gemini/v1beta/models/gemini-2.5-flash-preview-tts:generateContent`;
                            const res = await apiFetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                            const data = await res.json();
                            const pcmBase64 = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                            if (!pcmBase64) throw new Error("Audio data missing");
                            const bin = atob(pcmBase64); const bytes = new Uint8Array(bin.length);
                            for (let j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
                            const count = Math.floor(bytes.length / 2);
                            const out = new Float32Array(count);
                            for (let k = 0; k < count; k++) {
                                const idx = k * 2;
                                const int16 = (bytes[idx + 1] << 8) | bytes[idx];
                                out[k] = (int16 >= 0x8000 ? int16 - 0x10000 : int16) / 32768.0;
                            }
                            const wav = exportWAV(out, 24000);
                            const audio = new Audio(URL.createObjectURL(wav));
                            previewAudioObjRef.current = audio;

                                        }} className="flex flex-col md:flex-row gap-3 items-stretch md:items-center">
                                            <input type="email" value={manualCredit.email} onChange={e => setManualCredit({ ...manualCredit, email: e.target.value })} placeholder="User Email" required className={`flex-1 p-3 rounded-xl outline-none text-xs ${neoPressedClass}`} />
                                            <input type="number" value={manualCredit.amount || ''} onChange={e => setManualCredit({ ...manualCredit, amount: parseInt(e.target.value) })} placeholder="Credit ပမာဏ" required className={`w-36 p-3 rounded-xl outline-none text-xs ${neoPressedClass}`} />
                                            <input type="number" value={manualCredit.valid_days || ''} onChange={e => setManualCredit({ ...manualCredit, valid_days: parseInt(e.target.value) })} placeholder="ရက်ပေါင်း" required className={`w-24 p-3 rounded-xl outline-none text-xs text-center ${neoPressedClass}`} />
                                            <button type="submit" className="px-6 py-3 bg-purple-600 text-white font-bold rounded-xl text-xs shadow-md">Add Credits</button>
                                        </form>
                                    </div>
                                )}
                            </div>
                        )}

                        {selectedOrderToDeliver && (
                            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-[9999]">
                                <div className={`w-full max-w-md p-6 rounded-3xl space-y-4 ${neoClass}`}>
                                    <div className="flex justify-between items-center border-b border-current/10 pb-2">
                                        <h3 className="font-bold text-sm">ပစ္စည်းပို့ဆောင်ခြင်း: {selectedOrderToDeliver.product_name}</h3>
                                        <button onClick={() => setSelectedOrderToDeliver(null)}><XIcon className="w-5 h-5"/></button>
                                    </div>
                                    <form onSubmit={handleDeliverOrder} className="space-y-3 text-xs">
                                        <p><b>User Email:</b> {selectedOrderToDeliver.user_email}</p>
                                        <textarea rows="4" placeholder="ပို့ဆောင်မည့် အကြောင်းအရာ (Account/Password/License Key စသည်ဖြင့် စာရိုက်ပါ)..." value={deliveryMessage} onChange={e=>setDeliveryMessage(e.target.value)} required className={`w-full p-3 rounded-xl outline-none ${neoPressedClass}`}></textarea>
                                        <input type="file" onChange={e=>setDeliveryFile(e.target.files[0])} className="w-full p-2 border border-dashed rounded-xl" />
                                        <button type="submit" className="w-full py-3 bg-amber-500 text-black font-bold rounded-xl shadow-md">User ထံသို့ တိုက်ရိုက် ပို့ဆောင်မည်</button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
